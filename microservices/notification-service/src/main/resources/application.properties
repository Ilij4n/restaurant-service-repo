spring.application.name=notification-service
server.port=8083

# You can access the H2 console for each service at:
# User Service: http://localhost:8081/h2-console
# Reservation Service: http://localhost:8082/h2-console
# Notification Service: http://localhost:8083/h2-console
# Note: When connecting to the H2 console:
# JDBC URL should match the one in properties (jdbc:h2:mem:userdb, etc.)
# Username: sa
# Password: leave empty

# H2 Database Config
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

# Secret key for JWT
oauth.jwt.secret=NajTajanstvenijaSifraKnownnnnToMannnnAjZverrrrrrrr

# Restaurant Service Connection
services.restaurant-service.base-url=http://localhost:8082

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Queue names
rabbitmq.queue.notification=notification.queue

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:change-me}
spring.mail.password=${MAIL_PASSWORD:change-me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


